name: Tests

on:
  pull_request:
    branches:
    - main
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    steps:
    - name: Git - Checkout
      uses: actions/checkout@v7

    - name: .NET - Setup
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x

    - name: .NET - Restore
      run: dotnet restore

    - name: .NET - Build
      run: dotnet build --no-restore -c Release

    - name: .NET - Test
      run: dotnet test --no-build -c Release --verbosity normal

name: Tests

on:
  pull_request:
    branches:
    - main
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    steps:
    - name: Git - Checkout
      uses: actions/checkout@v7

    - name: .NET - Setup
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x

    - name: Test
      shell: pwsh
      run: |
        dotnet restore
        dotnet build --no-restore -c Release
        dotnet test --no-build -c Release --verbosity normal
